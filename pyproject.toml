[project]
name = "docpilot"
version = "0.1.0"
description = "RAG agent for technical documentation Q&A with confidence guardrails"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
