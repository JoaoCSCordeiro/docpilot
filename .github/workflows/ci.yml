name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest

  retrieval-gate:
    # Avaliacao de retrieval sem LLM contra data/evaluation/baseline.json: falha se uma
    # metrica cair mais do que a tolerancia guardada no baseline.
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-mmarco-mMiniLMv2-L12-H384-v1

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1

      - name: Index corpus
        run: python scripts/index_documents.py

      - name: Retrieval gate
        run: python scripts/check_retrieval_gate.py

  terraform:
    # So validacao estatica: o CI nao tem credenciais de cloud e nunca corre plan/apply.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: [infra/terraform, infra/terraform-azure]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Init (no backend)
        run: terraform -chdir=${{ matrix.module }} init -backend=false -input=false

      - name: Format check
        run: terraform -chdir=${{ matrix.module }} fmt -check -recursive

      - name: Validate
        run: terraform -chdir=${{ matrix.module }} validate

      - name: Set up TFLint
        if: matrix.module == 'infra/terraform-azure'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: TFLint
        if: matrix.module == 'infra/terraform-azure'
        working-directory: ${{ matrix.module }}
        run: |
          tflint --init
          tflint --format compact
        env:
          # O tflint --init descarrega o plugin azurerm do GitHub; com token evita o
          # rate limit da API para pedidos anonimos.
          GITHUB_TOKEN: ${{ github.token }}
