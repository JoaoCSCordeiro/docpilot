name: LLM evaluation

# Manual only: each run spends Groq free-tier quota (about 60 calls without cache).
on:
  workflow_dispatch:

jobs:
  llm-eval:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MAX_CALLS_PER_MINUTE: "4"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"

    steps:
      - name: Skip when the GROQ_API_KEY secret is not configured
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::GROQ_API_KEY secret is not set; skipping the LLM evaluation."

      - name: Checkout
        if: env.GROQ_API_KEY != ''
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.GROQ_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        if: env.GROQ_API_KEY != ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        if: env.GROQ_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-ms-marco-MiniLM-L-6-v2

      - name: Wait for Qdrant
        if: env.GROQ_API_KEY != ''
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1

      - name: Index corpus
        if: env.GROQ_API_KEY != ''
        run: python scripts/index_documents.py

      - name: Run LLM evaluation with judge
        if: env.GROQ_API_KEY != ''
        run: python -X utf8 scripts/run_llm_evaluation.py --output-dir eval-output

      - name: Upload report
        if: env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: eval-output/
